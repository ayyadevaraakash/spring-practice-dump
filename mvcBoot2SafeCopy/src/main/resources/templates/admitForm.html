
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admit Patient</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 520px;
            margin: 48px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        h1 {
            margin: 0 0 16px;
            font-size: 22px;
            text-align: center;
            color: #222;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #cfd4dc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admit Patient</h1>
        <form action="successMethod" method="post">
            <label for="name">Patient Name</label>
            <input type="text" id="name" name="name" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" required>

            <label for="disease">Disease / Condition</label>
            <input type="text" id="disease" name="disease" required>

            <button type="submit">Submit Admission</button>
        </form>
    </div>
</body>
</html>
